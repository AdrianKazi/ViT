[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vit"
version = "0.1.0"
description = "Vision Transformer (Dosovitskiy et al., 2021) from scratch in PyTorch: training on CIFAR-100 and fine-tuning of the official ImageNet-21k weights"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "datasets>=2.18",
    "timm>=1.0",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
